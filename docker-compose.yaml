version: '3.8'

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "1002:1002" # Replace with your user and group ID (`id -u` and `id -g`)
    network_mode: 'bridge'
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/plexLive/0_Music:/media/music:ro
    restart: unless-stopped

